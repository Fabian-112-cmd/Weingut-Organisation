<script>
(()=>{

board.after(divider);
let ratio=null,dragging=false;
const clamp=value=>Math.max(25,Math.min(65,value));

divider.setAttribute('aria-valuenow',String(Math.round(current()||45)));
divider.addEventListener('pointerdown',event=>{if(event.button!==0)return;dragging=true;divider.setPointerCapture(event.pointerId);document.body.classList.add('resizing-layout');event.preventDefault()});

(()=>{
const page=document.createElement('section');page.className='vine-page';page.id='weinberge';document.querySelector('#application main').append(page);
const jump=document.createElement('button');jump.textContent='Weinberge & Ernte ↓';jump.onclick=()=>page.scrollIntoView({behavior:'smooth'});document.querySelector('.account-pop').prepend(jump);
let records=[],busy=false,last='';client.auth.onAuthStateChange((event,session)=>{if(!session||event==='SIGNED_OUT'){page.replaceChildren();records=[];last=''}});
const n=v=>Number(v).toLocaleString('de-DE',{maximumFractionDigits:2});const ha=v=>Number(v).toLocaleString('de-DE',{minimumFractionDigits:4,maximumFractionDigits:4});
function node(tag,text){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;return x}
async function load(){if(!uid){page.replaceChildren();records=[];last='';return}if(busy)return;const token=generation,y=activeYear();const res=await client.from('wg_weinberge_ernte').select('*').eq('jahr',y).order('name');if(token!==generation||y!==activeYear())return;if(res.error){page.replaceChildren(node('h2','Weinberge & Ernte'),node('p','Bitte Datenbank-Infotafel-12.sql einrichten. '+res.error.message));return}records=res.data;last=uid+':'+y;draw()}
async function edit(group,row){
const ask=(label,value)=>prompt(label,value??'');
const name=ask('Name / Lage des Wingerts',row?.name);if(name===null)return;if(!name.trim()||name.length>100)return alert('Bitte einen Namen mit höchstens 100 Zeichen eingeben.');
const values={};for(const [key,label,old]of [['hektar','Fläche in Hektar',row?.hektar],['reihen','Reihen insgesamt (leer = noch unbekannt)',row?.reihen],['geerntet','Bereits geerntete Reihen insgesamt',row?.geerntet??0],['tonnen','Bisher geerntete Tonnen insgesamt (leer = unbekannt)',row?.tonnen]]){const raw=ask(label,old);if(raw===null)return;const value=raw.trim()===''?null:Number(raw.replace(',','.'));if((!['tonnen','reihen'].includes(key)&&value===null)||value!==null&&(!Number.isFinite(value)||value<0))return alert('Bitte eine gültige positive Zahl eingeben.');values[key]=value}
if(values.reihen!==null&&(!Number.isInteger(values.reihen)||values.reihen<1)||!Number.isInteger(values.geerntet)||values.geerntet<0||values.reihen!==null&&values.geerntet>values.reihen||values.reihen===null&&values.geerntet>0)return alert('Bitte ganze Reihen eingeben. Geerntete Reihen dürfen die Gesamtzahl nicht überschreiten.');
const note=ask('Bemerkung (optional)',row?.bemerkung);if(note===null)return;const y=activeYear(),token=generation;busy=true;
const data={...values,name:name.trim(),gruppe:group,jahr:y,bemerkung:note};let q=row?client.from('wg_weinberge_ernte').update(data).eq('id',row.id).eq('revision',row.revision):client.from('wg_weinberge_ernte').insert(data);const res=await q.select('id');busy=false;if(token!==generation)return;if(res.error||!res.data?.length)return alert(res.error?.message||'Zwischenzeitlich geändert. Bitte aktualisieren und erneut versuchen.');await load()}
function draw(){page.replaceChildren(node('h2','Weinberge & Ernte · '+activeYear()),node('p','Restmenge = bisherige Tonnen ÷ geerntete Reihen × übrige Reihen. Grobe Schätzung bei gleichem Ertrag pro Reihe. Mengen sind immer die bisherigen Gesamtmengen.'));const grid=node('div');grid.className='vine-grid';page.append(grid);for(const group of ['BIO','PAU']){const card=node('section');card.className='card';const head=node('div');head.className='card-head';head.append(node('h2',group));const add=node('button','＋ Wingert');add.onclick=()=>edit(group);head.append(add);card.append(head);const wrap=node('div');wrap.className='vine-scroll';const table=node('table'),thead=node('thead'),hr=node('tr');for(const label of ['Wingert','ha','Reihen','Geerntet','Übrig','Tonnen','Rest ca. (t)','Status',''])hr.append(node('th',label));thead.append(hr);table.append(thead);const body=node('tbody');const items=records.filter(x=>x.gruppe===group);for(const row of items){const tr=node('tr'),left=row.reihen===null?null:row.reihen-row.geerntet;tr.className=left===0?'done':row.geerntet?'partial':'';const estimate=left!==null&&row.geerntet>0&&row.tonnen!==null?row.tonnen/row.geerntet*left:null;for(const value of [row.name,ha(row.hektar),row.reihen??'—',row.geerntet,left??'—',row.tonnen===null?'—':n(row.tonnen),estimate===null?'—':n(estimate),left===0?'Fertig':left===null?'Reihen fehlen':row.geerntet?'Teilweise':'Offen'])tr.append(node('td',value));const td=node('td'),button=node('button','Eintragen');button.onclick=()=>edit(group,row);td.append(button);if(row.bemerkung)button.title=row.bemerkung;tr.append(td);body.append(tr)}table.append(body);wrap.append(table);card.append(wrap);if(!items.length)card.append(node('p','Noch keine Weinberge für dieses Erntejahr. Über „＋ Wingert“ hinzufügen.'));grid.append(card)}}
window.addEventListener('herbstjahr13',()=>void load());
setInterval(()=>{if(!uid){if(last)load();return}if(last!==uid+':'+activeYear())load()},1000);
setInterval(()=>{if(uid&&!busy)load()},60000);
})();
</script><script>
(()=>{
const dialog=document.createElement('dialog');dialog.id='stammdaten13';dialog.className='master13';document.body.append(dialog);
let kind='weinberge',group='BIO',items=[],busy=false,version=0;
const make=(tag,text)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;return x};
const btn=(text,run)=>{const x=make('button',text);x.type='button';x.onclick=run;return x};
const msg=make('p');msg.setAttribute('role','status');
function clear(){version++;items=[];dialog.replaceChildren();if(dialog.open)dialog.close()}
client.auth.onAuthStateChange((event,session)=>{if(!session||event==='SIGNED_OUT')clear()});
function layout(){dialog.replaceChildren();const head=make('div');head.className='master-head';head.append(make('h2','Stammdaten'),btn('Schließen',()=>dialog.close()));dialog.append(head);const nav=make('nav');nav.className='master-nav';for(const k of ['weinberge','sorten'])for(const g of ['BIO','PAU']){const b=btn((k==='weinberge'?'Weinberge ':'Weinsorten ')+g,()=>{kind=k;group=g;void load()});b.className=k===kind&&g===group?'primary':'';nav.append(b)}dialog.append(nav,make('p','Dauerhafte Stammdaten. Änderungen gelten für künftig vorbereitete Jahre. Vorhandene Jahreslisten behalten ihre eigenen Einträge. Gleichnamige Einträge sind unabhängig.'),msg)}
async function load(){if(!uid)return;const seq=++version,auth=generation;layout();msg.textContent='Lädt …';const result=await client.from('wg_stamm_'+kind).select('*').eq('gruppe',group).eq('entfernt',false).order('position').order('name');if(seq!==version||auth!==generation)return;if(result.error){msg.textContent=result.error.message;return}items=result.data;msg.textContent='';render()}
function render(){const add=btn(kind==='weinberge'?'＋ Wingert':'＋ Weinsorte',()=>form());dialog.append(add);const wrap=make('div');wrap.className='master-scroll';const table=make('table'),head=make('tr');for(const label of kind==='weinberge'?['Wingert','Fläche (ha)','Reihen','Status','']:['Weinsorte','Status',''])head.append(make('th',label));const thead=make('thead');thead.append(head);table.append(thead);const body=make('tbody');for(const row of items){const tr=make('tr');tr.append(make('td',row.name));if(kind==='weinberge'){tr.append(make('td',Number(row.hektar).toLocaleString('de-DE',{minimumFractionDigits:4,maximumFractionDigits:4})),make('td',row.reihen??'—'))}tr.append(make('td',row.aktiv?'Aktiv':'Deaktiviert'));const actions=make('td');actions.append(btn('Bearbeiten',()=>form(row)),btn(row.aktiv?'Deaktivieren':'Aktivieren',()=>save(row,{aktiv:!row.aktiv})),btn('Entfernen',()=>{if(confirm('„'+row.name+'“ aus den Stammdaten entfernen? Bereits gespeicherte Jahresdaten bleiben erhalten.'))void save(row,{entfernt:true,aktiv:false})}));tr.append(actions);body.append(tr)}table.append(body);wrap.append(table);dialog.append(wrap);if(!items.length)dialog.append(make('p','Noch keine Einträge.'));}
async function save(row,values){if(busy||!uid)return false;busy=true;dialog.querySelectorAll('button,input').forEach(x=>x.disabled=true);const auth=generation,table='wg_stamm_'+kind;
try{let query=row?client.from(table).update(values).eq('id',row.id).eq('revision',row.revision):client.from(table).insert({...values,gruppe:group,position:Math.max(0,...items.map(x=>x.position))+1});const result=await query.select('*');if(auth!==generation)return false;if(result.error)throw result.error;if(result.data?.length!==1)throw Error('Zwischenzeitlich geändert. Bitte Verwaltung neu öffnen und erneut prüfen.');await load();return true}catch(e){msg.textContent='Nicht gespeichert: '+e.message;return false}finally{busy=false;dialog.querySelectorAll('button,input').forEach(x=>x.disabled=false)}}
function form(row){layout();const f=make('form');f.className='master-form';const field=(title,type,value,step)=>{const label=make('label',title),input=make('input');input.type=type;input.value=value??'';if(step)input.step=step;label.append(input);f.append(label);return input};const name=field(kind==='weinberge'?'Wingert (ohne dreistellige Nummer)':'Weinsorte','text',row?.name);name.required=true;name.maxLength=100;let area,rows;if(kind==='weinberge'){area=field('Nettofläche in Hektar','number',row?.hektar,'0.0001');area.min=0;area.required=true;rows=field('Reihen (optional)','number',row?.reihen,'1');rows.min=1;}const active=field('Aktiv','checkbox','');active.checked=row?.aktiv??true;const buttons=make('div'),submit=make('button','Speichern');submit.type='submit';buttons.append(submit,btn('Abbrechen',()=>void load()));f.append(buttons);f.onsubmit=async event=>{event.preventDefault();const data={name:name.value.trim().replace(kind==='weinberge'?/^\d{3}\s*[-–]\s*/:/^$/,''),aktiv:active.checked};if(!data.name){msg.textContent='Bitte einen Namen eingeben.';return}if(kind==='weinberge'){data.hektar=Number(area.value);data.reihen=rows.value===''?null:Number(rows.value);if(!Number.isFinite(data.hektar)||data.hektar<0||data.reihen!==null&&(!Number.isInteger(data.reihen)||data.reihen<1)){msg.textContent='Bitte Fläche und ganze Reihen prüfen.';return}}await save(row,data)};dialog.append(f);name.focus()}
const open=btn('Stammdaten',()=>{if(!uid)return;void load();dialog.showModal()});document.querySelector('.account-pop').prepend(open);
dialog.addEventListener('cancel',event=>{if(busy)event.preventDefault()});
})();
</script>
</body></html>
