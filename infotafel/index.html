client.auth.getSession().then(r=>{if(r.error)$('loginError').textContent=r.error.message;else if(r.data.session?.user.id!==uid)void applySession(r.data.session)});
async function refresh(){if(!uid||loading||uploading||tableSaving)return;loading=true;const v=generation;try{const r=await client.from('wg_infotafel').select('*');if(v!==generation)return;if(r.error)throw Error('Infotafel noch nicht eingerichtet oder nicht erreichbar. Bitte Datenbank-Infotafel-1.sql ausführen. '+r.error.message);current=r.data;$('globalError').textContent='';for(const [slot]of slots){const doc=current.find(d=>d.slot===slot);if(!doc)continue;$(slot+'-pick').textContent='Dokument ersetzen';$(slot+'-stamp').textContent=doc.dateiname+' · '+new Date(doc.aktualisiert_am).toLocaleString('de-DE');if(shown.get(slot)?.revision===doc.revision)continue;try{const res=await client.storage.from(bucket).download(doc.pfad);if(v!==generation)return;if(res.error)throw res.error;const url=URL.createObjectURL(res.data);if($('viewer').open&&$('viewer').dataset.slot===slot)closeViewer();const old=shown.get(slot);if(old){URL.revokeObjectURL(old.url);viewUrls.delete(old.url)}viewUrls.add(url);shown.set(slot,{revision:doc.revision,url});$(slot+'-sheet').replaceChildren(preview(doc,url));$(slot+'-open').disabled=false}catch(e){$(slot+'-stamp').textContent='Laden fehlgeschlagen. Über Menü → Aktualisieren erneut versuchen. '+e.message}}$('sync').textContent='Stand geprüft um '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}catch(e){if(v===generation)error(e)}finally{loading=false}}
async function fileType(file){if(!file.size||file.size>20*1024*1024)throw Error('Bitte eine Datei bis 20 MB auswählen.');const b=new Uint8Array(await file.slice(0,12).arrayBuffer()),t=String.fromCharCode(...b);if(t.startsWith('%PDF-'))return ['application/pdf','pdf'];if(b[0]===255&&b[1]===216&&b[2]===255)return ['image/jpeg','jpg'];if(b[0]===137&&t.slice(1,4)==='PNG')return ['image/png','png'];if(t.startsWith('RIFF')&&t.slice(8,12)==='WEBP')return ['image/webp','webp'];throw Error('Bitte PDF, JPG, PNG oder WebP auswählen. Excel- und Word-Dateien vorher als PDF speichern.')}
async function upload(slot,file){if(!uid||uploading||loading||tableSaving||dirty)return;const user=uid,v=generation,prior=current.find(d=>d.slot===slot);lock(true);$('globalError').textContent='';let path,committed=false,uncertain=false;try{const [mime,ext]=await fileType(file);if(v!==generation)return;path=user+'/'+crypto.randomUUID()+'.'+ext;$(slot+'-stamp').textContent='Dokument wird hochgeladen …';const up=await client.storage.from(bucket).upload(path,file,{contentType:mime,upsert:false});if(up.error)throw up.error;if(v!==generation)return;const args={p_slot:slot,p_pfad:path,p_dateiname:file.name.slice(0,250),p_mime:mime,p_groesse:file.size,p_revision:prior?.revision||null};let saved=await client.rpc('wg_infotafel_speichern',args);if(saved.error){uncertain=true;saved=await client.rpc('wg_infotafel_speichern',args)}if(saved.error)throw saved.error;committed=true;uncertain=false;if(saved.data?.alter_pfad){try{await client.storage.from(bucket).remove([saved.data.alter_pfad])}catch{}}}catch(e){if(v===generation)error(Error(e.message+(uncertain?' Bitte aktualisieren und prüfen, ob das neue Dokument bereits angezeigt wird.':'')));if(path&&!committed&&!uncertain&&v===generation)await client.storage.from(bucket).remove([path])}finally{lock(false);if(v===generation)await refresh()}}
$('refresh').onclick=()=>void refresh();$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else error(Error('Bitte im Browser die Vollbildansicht verwenden, am PC mit F11.'))}catch(e){error(e)}};
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'Vollbild beenden':'Vollbild'});
window.addEventListener('beforeunload',e=>{if(uploading){e.preventDefault();e.returnValue=''}});
let monthKey='';function tick(){const now=new Date();$('clock').textContent=now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});$('date').textContent=now.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const key=now.toDateString();if(monthKey===key)return;monthKey=key;$('month').textContent=now.toLocaleDateString('de-DE',{month:'long',year:'numeric'});const c=$('calendar');c.replaceChildren();for(const d of ['Mo','Di','Mi','Do','Fr','Sa','So'])c.append(el('span',d,'week'));const offset=(new Date(now.getFullYear(),now.getMonth(),1).getDay()+6)%7;for(let i=0;i<offset;i++)c.append(el('span',''));const days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();for(let d=1;d<=days;d++){const cell=el('span',d,d===now.getDate()?'today':'');if(d===now.getDate())cell.setAttribute('aria-current','date');c.append(cell)}}tick();setInterval(tick,1000);setInterval(()=>{if(!document.hidden)void refresh()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();void refresh()}});
const tables=[['pau_ingo','PAU → Ingo'],['pau_gerd','PAU → Gerd'],['bio_ingo','BIO → Ingo'],['bio_gerd','BIO → Gerd']];
let rows=[],tableSaving=false,yearVersion=0,templateModes=new Set(),dirty=false,loadedYear=new Date().getFullYear();
const activeYear=()=>Number($('year').value);
for(let y=new Date().getFullYear()+1;y>=2020;y--){const o=el('option','Erntejahr '+y);o.value=y;$('year').append(o)}$('year').value=new Date().getFullYear();
function amount(v){return v===null||v===undefined?'':Number(v).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:3})}
function parseAmount(value){const t=value.trim();if(!t)return null;const n=Number(t.replace(/\s/g,'').replace(',','.'));if(!Number.isFinite(n)||n<0||n>1000000)throw Error('Bitte eine Menge zwischen 0 und 1.000.000 eingeben, z. B. 12,50.');return n}
function tableLock(on){tableSaving=on;for(const e of $('tables').querySelectorAll('input,button'))e.disabled=on;$('year').disabled=on;$('newYear').disabled=on;$('logout').disabled=on||uploading}
async function loadYear(){if(!uid||tableSaving||dirty)return;const user=uid,g=generation,v=++yearVersion,y=activeYear();try{const ensure=await client.rpc('wg_infotafel_jahr',{p_jahr:y});if(ensure.error)throw ensure.error;const r=await client.from('wg_infotafel_zeilen').select('*').eq('jahr',y).order('position');if(g!==generation||user!==uid||v!==yearVersion)return;if(r.error)throw r.error;rows=r.data;loadedYear=y;drawTables();$('tableStatus').textContent='Gespeichert'}catch(e){if(g===generation)$('tableStatus').textContent='Tabellen nicht geladen: '+e.message}}
async function saveRow(row,field,value){if(tableSaving||!uid)return;const g=generation;tableLock(true);$('tableStatus').textContent='Speichert …';try{const r=await client.from('wg_infotafel_zeilen').update({[field]:value}).eq('id',row.id).eq('revision',row.revision).select('*');if(g!==generation)return;if(r.error)throw r.error;if(r.data?.length!==1)throw Error('Diese Zeile wurde gleichzeitig geändert. Bitte über das Menü aktualisieren und die Eingabe prüfen.');rows=rows.map(x=>x.id===row.id?r.data[0]:x);dirty=false;drawTables();$('tableStatus').textContent='Gespeichert'}catch(e){if(g===generation){dirty=true;$('tableStatus').textContent=e.message+' Eingabe noch nicht gespeichert.'}}finally{tableLock(false)}}
function drawTables(){$('tables').replaceChildren();for(const [id,title]of tables){const box=el('section',undefined,'table-card'),head=el('div',undefined,'table-head');head.append(el('h2',title));const edit=button(templateModes.has(id)?'Vorlage fertig':'Vorlage bearbeiten',()=>{if(dirty)return;templateModes.has(id)?templateModes.delete(id):templateModes.add(id);drawTables()});head.append(edit);box.append(head);const scroll=el('div',undefined,'table-scroll'),t=el('table'),th=el('thead'),hr=el('tr');for(const x of ['Weinsorte','Benötigt','Tatsächlich','✓',''])hr.append(el('th',x));th.append(hr);t.append(th);const body=el('tbody');for(const row of rows.filter(r=>r.tafel===id)){const tr=el('tr',undefined,row.benoetigt===null?'unused':'');
const name=el('td');if(templateModes.has(id)){const input=el('input');input.value=row.sorte;input.maxLength=100;input.setAttribute('aria-label','Weinsorte');input.oninput=()=>dirty=true;input.onchange=()=>{if(!input.value.trim()){input.setCustomValidity('Bitte eine Weinsorte eingeben');input.reportValidity();return}void saveRow(row,'sorte',input.value.trim())};name.append(input)}else name.textContent=row.sorte;tr.append(name);
for(const key of ['benoetigt','tatsaechlich']){const td=el('td'),wrap=el('div',undefined,'amount'),input=el('input');input.value=amount(row[key]);input.inputMode='decimal';input.setAttribute('aria-label',row.sorte+' '+(key==='benoetigt'?'benötigt':'tatsächlich')+' in Tonnen');const unit=el('span',row[key]===null?'':'t');input.oninput=()=>{dirty=true;unit.textContent=input.value.trim()?'t':''};input.onchange=()=>{try{void saveRow(row,key,parseAmount(input.value))}catch(e){$('tableStatus').textContent=e.message}};wrap.append(input,unit);td.append(wrap);tr.append(td)}
const check=el('input');check.type='checkbox';check.checked=row.erledigt;check.setAttribute('aria-label',row.sorte+' erledigt');check.onchange=()=>void saveRow(row,'erledigt',check.checked);const done=el('td');done.append(check);const note=el('td'),nb=button(row.bemerkung?'▣':'▤',()=>{const text=prompt('Bemerkung zu '+row.sorte,row.bemerkung||'');if(text!==null){if(text.length>2000){$('tableStatus').textContent='Bemerkung maximal 2000 Zeichen.';return}void saveRow(row,'bemerkung',text)}});nb.title=row.bemerkung||'Bemerkung hinzufügen';nb.setAttribute('aria-label','Bemerkung zu '+row.sorte);note.append(nb);tr.append(done,note);body.append(tr)}t.append(body);scroll.append(t);box.append(scroll);
if(templateModes.has(id))box.append(button('＋ Weinsorte',async()=>{const name=prompt('Neue Weinsorte');if(!name?.trim()||name.length>100||tableSaving)return;tableLock(true);try{const p=Math.max(0,...rows.filter(r=>r.tafel===id).map(r=>r.position))+1;const r=await client.from('wg_infotafel_zeilen').insert({jahr:activeYear(),tafel:id,position:p,sorte:name.trim()});if(r.error)throw r.error;dirty=false}catch(e){$('tableStatus').textContent=e.message}finally{tableLock(false);await loadYear()}}));$('tables').append(box)}}
$('year').onchange=()=>{if(dirty){$('year').value=loadedYear;$('tableStatus').textContent='Bitte offene Eingaben zuerst speichern oder über Aktualisieren neu laden.';return}void loadYear()};
$('newYear').onclick=()=>{if(dirty||tableSaving)return;const entered=prompt('Erntejahr anlegen – Weinsorten werden übernommen, Mengen und Haken bleiben leer.',Number($('year').value)+1);if(entered===null)return;const n=Number(entered);if(!Number.isInteger(n)||n<2000||n>2100){$('tableStatus').textContent='Bitte ein Jahr zwischen 2000 und 2100 eingeben.';return}if(![...$('year').options].some(o=>Number(o.value)===n)){const o=el('option','Erntejahr '+n);o.value=n;$('year').prepend(o)}$('year').value=n;void loadYear()};
$('refresh').onclick=async()=>{if(tableSaving||uploading)return;if(dirty&&!confirm('Noch nicht gespeicherte Eingaben verwerfen und neu laden?'))return;dirty=false;await refresh();await loadYear()};setInterval(()=>{if(!document.hidden&&!$('tables').contains(document.activeElement))void loadYear()},60000);
window.addEventListener('beforeunload',e=>{if(tableSaving||dirty){e.preventDefault();e.returnValue=''}});

// Nur Fehlerhinweise anzeigen, keine permanente Speicherzeile.
const status6=$('tableStatus');function showStatus6(){status6.hidden=!status6.textContent||['Gespeichert','Speichert …'].includes(status6.textContent.trim());}new MutationObserver(showStatus6).observe(status6,{childList:true,characterData:true,subtree:true});showStatus6();
